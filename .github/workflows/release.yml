name: Release AAB

# Déclenché par le push d'un tag de version (ex. `11.3` ou `11.3.1`).
# Produit un App Bundle prodRelease signé avec la clé d'upload Play, stockée
# en base64 dans le secret RELEASE_KEYSTORE_BASE64 (voir README, section
# « Release signée via GitHub Actions »).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # nécessaire pour créer la GitHub Release du tag

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  AAB_PATH: app/build/outputs/bundle/prodRelease/app-prod-release.aab

jobs:
  bundle:
    name: Build signed prodRelease bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 (temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check required secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          BASE_SERVER_URL: ${{ secrets.BASE_SERVER_URL }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS BASE_SERVER_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret manquant : $name"
              missing=1
            fi
          done
          exit $missing

      - name: Decode upload keystore (outside the repo)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/upload-key.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Create local.properties
        env:
          BASE_SERVER_URL: ${{ secrets.BASE_SERVER_URL }}
        run: echo "baseServerUrl=$BASE_SERVER_URL" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed prodRelease bundle
        env:
          # RELEASE_STORE_FILE est exporté par l'étape de décodage.
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          # Facultatif : si absent, build.gradle.kts retombe sur RELEASE_STORE_PASSWORD.
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleProdRelease --no-daemon --stacktrace

      - name: Verify the bundle is signed
        run: |
          test -f "$AAB_PATH" || { echo "::error::AAB introuvable : $AAB_PATH"; exit 1; }
          if unzip -l "$AAB_PATH" | grep -E 'META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo "AAB signé."
          else
            echo "::error::Aucune signature (META-INF/*.RSA|*.SF) dans $AAB_PATH : vérifier les secrets RELEASE_*."
            exit 1
          fi

      - name: Rename bundle with version
        id: rename
        run: |
          out="app/build/outputs/bundle/prodRelease/simply-awake-${{ github.ref_name }}.aab"
          mv "$AAB_PATH" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: simply-awake-${{ github.ref_name }}-aab
          path: ${{ steps.rename.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach bundle to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: ${{ steps.rename.outputs.path }}
          generate_release_notes: true

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks" local.properties

name: PR CI

on:
  pull_request:  # Runs for any PR from any branch
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (with Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create local.properties for CI
        run: |
          echo "baseServerUrl=${{ secrets.BASE_SERVER_URL }}" > local.properties

      - name: Run unit tests
        run: ./gradlew test

      - name: Assemble debug build
        run: ./gradlew assembleDebug
